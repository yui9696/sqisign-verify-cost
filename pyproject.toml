[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sqisign-verify-cost"
version = "0.1.0"
description = "Verification-cost / DoS-surface profiler for the SQIsign reference implementation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Moe Tabei", email = "tabei@ryun.jp" }]
keywords = ["sqisign", "isogeny", "post-quantum", "verification-cost", "denial-of-service", "benchmark"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security :: Cryptography",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/yui9696/sqisign-verify-cost"
Repository = "https://github.com/yui9696/sqisign-verify-cost"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
sqisign-verify-cost = "sqvcost.cli:main"

[tool.setuptools]
packages = ["sqvcost"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
